<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amber routing performance on a four-dollar DigitalOcean Droplet</title>
  <desc id="desc">Release compilation more than doubles throughput under load. At sixteen connections, the optimized router raises median throughput from 25,659 to 28,983 requests per second and lowers p99 latency by 24.4 percent. Stock Crystal and acrystal are within half a percent under load.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6e9"/>
      <stop offset="1" stop-color="#eee7d7"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.7" fill="#263b38" opacity="0.08"/>
      <circle cx="13" cy="11" r="0.6" fill="#c87c28" opacity="0.08"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#263b38" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <path d="M0 0H1600V76C1370 132 1172 98 945 53C667 -2 370 142 0 83Z" fill="#173f3b"/>
  <circle cx="1475" cy="24" r="172" fill="#d98b30" opacity="0.88"/>

  <g font-family="Avenir Next, Avenir, sans-serif" fill="#1b302d">
    <text x="74" y="150" font-size="24" font-weight="600" letter-spacing="3.5" fill="#b96c20">HOSTED ROUTER LAB · ROUND 20</text>
    <text x="74" y="211" font-family="Avenir Next Condensed, Avenir Next, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.4">What release mode changes on a $4 Droplet</text>
    <text x="76" y="251" font-size="23" fill="#64726e">1,000 Amber routes · separate 4-vCPU load generator · private VPC · medians</text>

    <g transform="translate(74 302)">
      <text x="0" y="0" font-size="19" font-weight="700" letter-spacing="1.8" fill="#52645f">ROUTED HTTP THROUGHPUT</text>
      <text x="695" y="0" text-anchor="end" font-size="17" fill="#6d7b77">requests / second</text>

      <g transform="translate(0 32)" font-size="17">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="#aeb8b2"/>
        <text x="29" y="15" fill="#52645f">default build</text>
        <rect x="158" y="0" width="18" height="18" rx="4" fill="#d98b30"/>
        <text x="187" y="15" fill="#52645f">release build</text>
      </g>

      <g transform="translate(0 82)">
        <line x1="112" y1="0" x2="812" y2="0" stroke="#798680" stroke-opacity="0.32"/>
        <line x1="112" y1="0" x2="112" y2="423" stroke="#798680" stroke-opacity="0.32"/>
        <line x1="331" y1="0" x2="331" y2="423" stroke="#798680" stroke-opacity="0.18"/>
        <line x1="550" y1="0" x2="550" y2="423" stroke="#798680" stroke-opacity="0.18"/>
        <line x1="769" y1="0" x2="769" y2="423" stroke="#798680" stroke-opacity="0.18"/>
        <g font-size="15" fill="#71807b">
          <text x="112" y="448" text-anchor="middle">0</text>
          <text x="331" y="448" text-anchor="middle">10k</text>
          <text x="550" y="448" text-anchor="middle">20k</text>
          <text x="769" y="448" text-anchor="middle">30k</text>
        </g>

        <g font-size="20" font-weight="600" fill="#344a46">
          <text x="0" y="65">1 conn</text>
          <text x="0" y="165">16 conn</text>
          <text x="0" y="265">64 conn</text>
          <text x="0" y="365">256 conn</text>
        </g>

        <g>
          <rect x="112" y="27" width="108" height="25" rx="7" fill="#aeb8b2"/>
          <rect x="112" y="58" width="151" height="25" rx="7" fill="#d98b30"/>
          <text x="229" y="47" font-size="16" fill="#52645f">4,955</text>
          <text x="272" y="78" font-size="16" font-weight="700" fill="#9c5819">6,893</text>
          <text x="815" y="65" font-size="18" font-weight="700" fill="#17736a">1.39x</text>

          <rect x="112" y="127" width="296" height="25" rx="7" fill="#aeb8b2"/>
          <rect x="112" y="158" width="650" height="25" rx="7" fill="#d98b30"/>
          <text x="417" y="147" font-size="16" fill="#52645f">13,551</text>
          <text x="771" y="178" font-size="16" font-weight="700" fill="#9c5819">29,710</text>
          <text x="815" y="165" font-size="18" font-weight="700" fill="#17736a">2.19x</text>

          <rect x="112" y="227" width="258" height="25" rx="7" fill="#aeb8b2"/>
          <rect x="112" y="258" width="614" height="25" rx="7" fill="#d98b30"/>
          <text x="379" y="247" font-size="16" fill="#52645f">11,810</text>
          <text x="735" y="278" font-size="16" font-weight="700" fill="#9c5819">28,089</text>
          <text x="815" y="265" font-size="18" font-weight="700" fill="#17736a">2.38x</text>

          <rect x="112" y="327" width="241" height="25" rx="7" fill="#aeb8b2"/>
          <rect x="112" y="358" width="580" height="25" rx="7" fill="#d98b30"/>
          <text x="362" y="347" font-size="16" fill="#52645f">11,025</text>
          <text x="701" y="378" font-size="16" font-weight="700" fill="#9c5819">26,535</text>
          <text x="815" y="365" font-size="18" font-weight="700" fill="#17736a">2.41x</text>
        </g>
      </g>
    </g>

    <g transform="translate(1020 304)">
      <rect width="506" height="224" rx="30" fill="#fffaf0" filter="url(#soft)"/>
      <path d="M0 30A30 30 0 0 1 30 0H506V11L0 92Z" fill="#d98b30" opacity="0.14"/>
      <text x="34" y="45" font-size="18" font-weight="700" letter-spacing="1.8" fill="#8d561c">ROUTER GAIN AT THE PRACTICAL PEAK</text>
      <text x="34" y="112" font-family="Avenir Next Condensed, Avenir Next, sans-serif" font-size="60" font-weight="700" fill="#173f3b">+13.0%</text>
      <text x="34" y="145" font-size="19" fill="#52645f">25,659 → 28,983 req/s · 16 connections</text>
      <line x1="34" y1="169" x2="472" y2="169" stroke="#8d9a95" stroke-opacity="0.32"/>
      <text x="34" y="201" font-size="18" font-weight="600" fill="#17736a">p99 latency 3.22 → 2.43 ms  ·  -24.4%</text>
    </g>

    <g transform="translate(1020 552)">
      <rect width="242" height="166" rx="26" fill="#173f3b" filter="url(#soft)"/>
      <text x="27" y="38" font-size="16" font-weight="700" letter-spacing="1.5" fill="#e5b36f">COMPILER PARITY</text>
      <text x="27" y="91" font-family="Avenir Next Condensed, Avenir Next, sans-serif" font-size="42" font-weight="700" fill="#fff7e8">&lt; 0.5%</text>
      <text x="27" y="122" font-size="16" fill="#d4dfda">difference at 16-256 conn</text>
      <text x="27" y="146" font-size="16" fill="#d4dfda">stock Crystal vs acrystal</text>
    </g>

    <g transform="translate(1284 552)">
      <rect width="242" height="166" rx="26" fill="#fffaf0" filter="url(#soft)"/>
      <text x="27" y="38" font-size="16" font-weight="700" letter-spacing="1.5" fill="#52645f">TARGET FOOTPRINT</text>
      <text x="27" y="91" font-family="Avenir Next Condensed, Avenir Next, sans-serif" font-size="42" font-weight="700" fill="#173f3b">10.6 MiB</text>
      <text x="27" y="122" font-size="16" fill="#65746f">peak memory at 16 conn</text>
      <text x="27" y="146" font-size="16" fill="#65746f">95.8% of one CPU</text>
    </g>

    <g transform="translate(1020 746)">
      <rect width="506" height="82" rx="22" fill="#dfe9e4"/>
      <circle cx="38" cy="41" r="13" fill="#17736a"/>
      <path d="M32 41l4 4 9-10" fill="none" stroke="#f9f2e4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="35" font-size="17" font-weight="700" fill="#29443f">29.1 million measured HTTP 200 responses</text>
      <text x="66" y="60" font-size="16" fill="#5d6c67">No failures · temporary Droplets and VPC destroyed</text>
    </g>

    <text x="76" y="859" font-size="16" fill="#6b7974">64-connection router-only A/B was inconclusive on shared CPU; it is not included as a claimed optimization.</text>
    <text x="1524" y="859" text-anchor="end" font-size="16" font-weight="700" letter-spacing="1.2" fill="#8d561c">AMBER V2 · JUL 2026</text>
  </g>
</svg>
